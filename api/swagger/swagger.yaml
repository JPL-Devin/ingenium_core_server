          $ref: '#/definitions/CmdStepInput'          
        execution_user_input:
          $ref: '#/definitions/CmdStepInput'
        execution:
          type: object
          properties:
            meta_data:
              $ref: '#/definitions/StepExecutionInfo'
            results:
              $ref: '#/definitions/CmdStepResult'   
                
  CmdStepInput:
    type: object
