          $ref: '#/definitions/CmdEntry'               

  CmdInputEntry:
    type: object
    description: Command (FSW/HW) inputs
    properties:         
      hw_fsw:
        description: Whether the command is a fsw command or a hardware command
        type: string
        enum:
            - FSW
            - HW
      timeout:
        description: Timeout on sending the command and verifying receipt (in seconds)
        type: integer         
        default: 60         
      string_selection:
        description: selection of command string (sides)      
        type: string
        enum:
          - DEFAULT
          - AB
          - A
          - B
      cmd_string:     
        description: Command Stem and required arguments.
        type: string
      verify:
        description: Whether to verify the receipt of the command
        type: boolean   

  CmdEntry:
    description: The results for each command that was sent
    allOf:
    - $ref: '#/definitions/CmdInputEntry'
    - type: object       
      required:
          - radiated
          - verified
      properties:
          radiated:
              description: Whether the command was radiated (i.e. sent)
              type: boolean
          radiated_time:
              description: Time the command was radiated
              type: string
          verified:
              description: Whether the command was radiated (i.e. sent)
              type: boolean
          verified_time:
              description: Time the command was radiated
              type: string         
  
