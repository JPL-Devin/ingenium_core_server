    - $ref: '#/definitions/Step'
    - type: object
      properties:
        specification:
          type: object
          properties:
            authoring_user_input:
              $ref: '#/definitions/WaitDataProductsStepInput'
            execution_user_input:
              $ref: '#/definitions/WaitDataProductsStepInput'
            results:
              $ref: '#/definitions/WaitDataProductsStepResult'              
        authoring_user_input:
          $ref: '#/definitions/WaitDataProductsStepInput'          
        execution_user_input:
          $ref: '#/definitions/WaitDataProductsStepInput'
        execution:
          type: object
          properties:
            meta_data:
              $ref: '#/definitions/StepExecutionInfo'
            results:
              $ref: '#/definitions/WaitDataProductsStepResult'    
                
  WaitDataProductsStepInput:
    type: object
    description: Input to wait data products step
    properties:
      data_path:
        description: path of the data (side A, side B, etc)
        type: string          
      start_time:
        description: Start of the time range
        type: string  
      lookback:
        description: Number of seconds to lookback (or lookbefore) the start time
        type: integer
        default: 0 
      timeout:
        description: Timeout of the query in seconds
        type: integer   
        default: 240                
      entries:
        description: Individual products to wait for (need to check at least one)
        type: array
        items:
            $ref: '#/definitions/DataProductsInputEntry'    
            
  WaitDataProductsStepResult:
    type: object
    description: Parameters of EVR query results
    properties:
      venue_id:
        description: unique id of the venue
        type: string
      venue_name:
        description: name the venue
        type: string        
      venue_ampcs_address:
        description: address of AMPCS
        type: string    
      translated_start_time:
        description: start time that was translated from time reference.
        type: string
      translated_end_time:
        description: end time that was translated from time reference
        type: string
      query_start_time:
        description: start of telemetry query range
        type: string
      query_end_time:
        description: end of telemetry query range
        type: string
      entries:
        description: List of products and the verification of their queries
        type: array
        items:
          $ref: '#/definitions/DataProductsEntry'                 

  # Cmd
  CmdStep:
    description: Sends one or more FSW or HW commands and optionally verifies their receipt
    allOf:
    - $ref: '#/definitions/Step'
    - type: object
      properties:
        specification:
          type: object
          properties:
            authoring_user_input:
              $ref: '#/definitions/CmdStepInput'
