definitions:

  ProcedureSimpleElement:
    properties:
      elem_id:
        type: string
        description: The unique identifier of the element  
      number:
        type: string
        description: element number in procedure or execution        
      title:
        type: string
      elem_type:
        type: string
        description: Type of the element        
        enum:   
        - SECTION
        - PROCEDURE_SECTION
        - PARAGRAPH
        - STEP
      executable:
        type: string
        description: type of execution supported for the element
        enum:
          - EXECUTED
          - COMPUTED
          - NONE    
      break_point:
        type: string
        description: stop automatic execution when reaching this element
        enum:
          - NONE
          - ACTIVE
          - INACTIVE
      parent_id:
        type: string
        description: id of the parent element. empty string for elements that are direct children of execution or procedure 
      procedure_section_id:
        type: string
        description: id of the procedure section to which this element belongs. Empty string if none.  
      procedure_modification_status:
        type: string
        description: |
          whether any redline/blueline is associated with the element
          * `NONE` - Not under run for score
          * `ORIGINAL` - Original from procedure
          * `MODIFIED` - Replaced by a redline
          * `MODIFYING` - Redline/blueline element that replaces the original element
          * `MODIFYING_OLD` - A modifying element that has been overtaken by another modifying element 
          * `DELETED` - Redlined/bluelined by deletion
          * `ADDED` - Redlined/bluelined by addition
        enum:
          - NONE
          - ORIGINAL
          - MODIFIED
          - MODIFYING
          - MODIFYING_OLD
          - DELETED
          - ADDED                               
      procedure_modification:
        $ref: '#/definitions/ProcedureModification'           

  ProcedureElement:
    allOf:
    - $ref: '#/definitions/ProcedureSimpleElement'
    - type: object    
      properties:
        procedure_id:
          type: string
          description: id of the procedure to which the element belongs (empty string for elements of execution without procedure)        
        procedure_title:
          type: string
          description: title of the procedure to which this element belongs. Empty string if none.
        executed:
          type: boolean
          description: true if this element has been executed
        verifiable:
          type: boolean
          description: true if this element has pass/fail status                            
        run_for_score:
          type: boolean         
          description: true if this element is a part of run for score procedure        
        execution_id:
          type: string
          description: id of the execution to which the element belongs (empty string for elements of procedure)
        description:
          type: string
        files:
          type: array
          items:
            $ref: '#/definitions/FileInfo'    
        conversations:
          type: array
          items:
            $ref: '#/definitions/Conversation'
        tag_ids:
          description: applied tags
          type: array
          items:
            type: string                             

  FileInfo:
    type: object
    description: Meta data of an attached file
    properties:
      file_id:
        type: string
        description: unique id of the file resource
      file_name:
        type: string
        description: original name of the file
      url:
        type: string
        description: download url of the file

  ProcedureConversationInput:
    properties:
      type:
        type: string
        description: type of comment
        enum:   
        - COMMENT
      status:
        description: status of this conversation
        type: string
        enum:   
        - UNRESOLVED
        - RESOLVED        

  ProcedureConversation:
    allOf:
    - $ref: '#/definitions/ConversationInput'
    - type: object    
      properties:
        conversation_id:  
          type: string
          description: id of the conversation
        time_resolved:
          description: Time the conversation was resolved
          type: string
        resolved_by:
          description: name of the user who resolved the conversation
          type: string
        comments:
          type: array
          items:
            $ref: '#/definitions/Comment'    
            
  ConversationInput:
    properties:
      type:
        type: string
        description: type of comment
        enum:   
        - COMMENT
        - ACTIVITY_REPORT_COMMENT
        - DATA_REVIEW_COMMENT
      status:
        description: status of this conversation
        type: string
        enum:   
        - UNRESOLVED
        - RESOLVED        

  Conversation:
    allOf:
    - $ref: '#/definitions/ConversationInput'
    - type: object    
      properties:
        conversation_id:  
          type: string
          description: id of the conversation
        time_resolved:
          description: Time the conversation was resolved
          type: string
        resolved_by:
          description: name of the user who resolved the conversation
          type: string
        comments:
          type: array
          items:
            $ref: '#/definitions/Comment'        
            
