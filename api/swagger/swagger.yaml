  # CustomScript
  CustomScriptStep:
    description: Run a custom script on Venue
    allOf:
    - $ref: '#/definitions/Step'
    - type: object
      properties:
        specification:
          type: object
          properties:
            authoring_user_input:
              $ref: '#/definitions/CustomScriptStepInput'
            execution_user_input:
              $ref: '#/definitions/CustomScriptStepInput'
            results:
              $ref: '#/definitions/CustomScriptStepResult'              
        authoring_user_input:
          $ref: '#/definitions/CustomScriptStepInput'          
        execution_user_input:
          $ref: '#/definitions/CustomScriptStepInput'
        execution:
          type: object
          properties:
            meta_data:
              $ref: '#/definitions/StepExecutionInfo'
            results:
              $ref: '#/definitions/CustomScriptStepResult'   
                
  CustomScriptStepInputBase:
    type: object
    description: base input to custom script step
    properties:
      script_name:
        description: The script name
        type: string
      script_path:
        description: path to the script file relative to the scripts installation directory. Must be unique.
        type: string        
      script_id:
        description: unique id of script_path (SHA256 hash of script_path)
        type: string
      description:
        description: Description of the script
        type: string
      hash:
        description: SHA3 hash of the script
        type: string
      status:
        description: Whether the script is available for active use or not.
        type: string
        enum:
          - ACTIVE
          - INACTIVE
      timeout:
        description: Timeout of the script in seconds
        type: integer      
        default: 240            
      inputs:
          description: Array of script inputs. 
          type: array
          items:
            $ref: "#/definitions/ScriptInput"         


  CustomScriptStepInput:
    type: object
    description: input to custom script step
    allOf:
    - $ref: '#/definitions/CustomScriptStepInputBase'
    - type: object
      properties:
        entries:
          description: input and output fields of entry
          type: array
          items:
            $ref: "#/definitions/ScriptEntryInput"      
        outputs:
            description: Array of script outputs
            type: array
            items:
              $ref: "#/definitions/ScriptOutput"
        output_array:
            $ref: "#/definitions/ScriptOutputArray"                       

  ScriptInput:
    type: object
    description: a single custom script input
    properties:
      name:
        description: The name of the input (the "key")
        type: string
      description:
        description: Description of the input field
        type: string
      phase:
        description: |
          Whether the script input is an authoring or execution phase input. Execution phase inputs are entered manually during execution. Authoring phase inputs are developed ahead of time and are under CM.
        type: string
        enum:
          - AUTHORING
          - EXECUTION
      required:
        description: Whether the input is required or optional
        type: string
        enum:
          - YES
          - NO
      type:
        description: |
          Type of the argument. Note that that there are special "Ingenium types" which will cause Ingenium to accept multiple formats and or do variable substitution. 
        type: string
        enum:
          - INT
          - STRING
          - FLOAT
          - BOOL
          - ENUM
          - DATA_PATH
          - TIME
          - VARIABLE
          - FLIGHT_COMMAND
          - SIM_COMMAND
          - FLIGHT_EVR
          - SIM_EVR
          - FLIGHT_TELEM
          - SIM_TELEM
          - VERIFICATION_COND
      enumerations:
          description: Used if the argument_type is ENUM
          type: array
          items:
            $ref: "#/definitions/Enumeration"
      value:
        description: value of the input
        type: string
      default_value:
        description: default value of the input if any
        type: string

  ScriptEntryInputBase:
    type: object
    description: Definition of a group of inputs
    properties:
      display_field:
        description: The name of an output field that will be displayed as the primary results
        type: string    
      entry_inputs:
          description: Input fields for the entry
          type: array
          items:
            $ref: "#/definitions/ScriptInput"

  ScriptEntryInput:
    description: Definition of a group of inputs and outputs (with a pass/fail status)
    allOf:
    - $ref: '#/definitions/ScriptEntryInputBase'
    - type: object
      properties:
        entry_outputs:
            description: Output fields for the entry
            type: array
            items:
              $ref: "#/definitions/ScriptOutput"
        entry_output_array:
            $ref: "#/definitions/ScriptOutputArray"
            
  ScriptEntryResult:
    description: Definition of a group of inputs, outputs (with a pass/fail status), and output values
    allOf:
    - $ref: '#/definitions/ScriptEntryInputBase'
    - type: object
      properties:
        verification_status:
          description: result of status verification
          type: string
          enum:
            - PASS
            - FAIL
            - PENDING
        entry_outputs:
            description: Output fields for the entry
            type: array
            items:
              $ref: "#/definitions/ScriptOutputResult"
        entry_output_array:
            $ref: "#/definitions/ScriptOutputArrayResult" 

  Enumeration:
    type: object
    properties:
        symbol:
            description: Display value of the enumeration
            type: string
        numeric:
            description: Numeric value of the enumeration
            type: integer    
                    
  ScriptOutput:
    type: object
    description: a single custom script output
    properties:
      name:
        description: The name of the output (the "key")
        type: string
      description:
        description: Description of the output field
        type: string
      type:
        description: Type of the argument 
        type: string
        enum:
          - INT
          - STRING
          - FLOAT
          - IMAGE
          - SERIES 
          - FILE         
  
  ScriptOutputResult:
    description: a single custom script output and its value
    allOf:
    - $ref: '#/definitions/ScriptOutput'
    - type: object
      properties:
        value:
          description: value of the output
          type: string  

  ScriptOutputArrayBase:
    type: object
    description: Definition of an array of outputs that can be repeated
    properties:
      name:
        description: The name of the output array (the "key")
        type: string
      description:
        description: The description of the output array
        type: string        
      max_entries:
        description: Maximum number of entries (Should not exceed ~10)
        type: integer
            
  ScriptOutputArray:
    type: object
    description: Definition of an array of outputs that can be repeated
    allOf:
    - $ref: '#/definitions/ScriptOutputArrayBase'
    - type: object    
      properties:
        outputs:
          description: Array of ScriptOutputArrayFields
          type: array
          items:
            $ref: "#/definitions/ScriptOutputArrayField"
            
  ScriptOutputArrayResult:
    type: object
    description: Definition of an array of outputs that can be repeated
    allOf:
    - $ref: '#/definitions/ScriptOutputArrayBase'
    - type: object    
      properties:   
        outputs:
          description: Array of ScriptOutputArrayFields with results
          type: array
          items:
            $ref: "#/definitions/ScriptOutputArrayFieldResult"              
          
  ScriptOutputArrayField:
    type: object
    description: Definition of a single custom script output
    properties:
      name:
        description: The name of the output (the "key")
        type: string
      description:
        description: Description of the output field
        type: string
      visible:
        description: Whether the field is displayed in the array table or in the mouse over details
        type: string
        enum:
          - YES
          - NO
      type:
        description: Type of the argument 
        type: string
        enum:
          - INT
          - STRING
          - FLOAT  
          
  ScriptOutputArrayFieldResult:
    type: object
    description: Definition of a single custom script output
    allOf:
    - $ref: '#/definitions/ScriptOutputArrayField'
    - type: object    
      properties:
        values:
          description: values of the field
          type: array
          items:
            type: string
          
                    
  CustomScriptStepResult:
    type: object
    description: result of custom script step
    allOf:
    - $ref: '#/definitions/CustomScriptStepInputBase'
    - type: object    
      properties:
        venue_id:
          description: unique id of the venue
          type: string
        venue_name:
          description: name the venue
          type: string        
        venue_ampcs_address:
          description: address of AMPCS
          type: string            
        entries:
          description: input and output fields of entry
          type: array
          items:
            $ref: "#/definitions/ScriptEntryResult"      
        outputs:
            description: Array of script outputs
            type: array
            items:
              $ref: "#/definitions/ScriptOutputResult"
        output_array:
            $ref: "#/definitions/ScriptOutputArrayResult"
        custom_script_status:
          description: result of status verification
          type: string
          enum:
            - PASS
            - FAIL
            - ERROR
            - PENDING
        log_file_local_path:
          description: path to the log file of the custom script on the venue
          type: string
        log_file_url:
          description: url of the log file that is available on a file server
          type: string
#
