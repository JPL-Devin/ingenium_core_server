        description: true if this is run for score
        type: boolean    
        
  Paragraph:
    allOf:
    - $ref: '#/definitions/ProcedureElement'

  StepExecutionInfo:
    properties:
      test_conductor:
        type: string
        description: User id of the person who ran the step
      time_started:
        description: The time the step execution was started
        type: string
      time_completed:
        description: The time the step execution was completed
        type: string
      time_updated:
        description: The time the step execution status was updated
        type: string        
      status:
        description: |
          execution status of the step
          * `PASS` - Step criteria passed
          * `FAIL` - Step criteria failed
          * `ERROR` - Error in execution
          * `OVERRIDE_PASS` - Status was overriden from fail to pass
          * `OVERRIDE_FAIL` - Status was overriden from pass to fail
          * `RUNNING` - Step is currently running
          * `SKIPPED` - Skipped since guard condition was not met
          * `NONE` - Step execution has not been executed yet
        type: string
        enum:
          - PASS
          - FAIL
          - ERROR
          - OVERRIDE_PASS
          - OVERRIDE_FAIL
          - RUNNING
          - SKIPPED
          - NONE
      status_message:    
        description: additional description of the current status. Typically available for long running steps.
        type: string      
      override_justification:
        description: Rationale of status override
        type: string           
      overridden_by:
        description: User who overrode the status
        type: string          
      time_overridden:
        description: The time when the step execution status was overridden
        type: string      
      error:
        $ref: "#/definitions/ErrorResponse"

  OverrideInput:
    type: object
    description: Input to override pass/fail status of step
    properties:
      override_justification:
        description: rationale for override
        type: string

