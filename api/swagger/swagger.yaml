swagger: "2.0"
info:
  version: "5.0.0"
  title: Ingenium Core API
#host: localhost:10010
basePath: /api/v5
schemes:
  - http
consumes:
  - application/json
produces:
  - application/json

securityDefinitions:
  UserSecurity:
    # Technically, this service uses JWT and the type should be apiKey.
    # But apiKey type of swagger does not support scopes since scope is not part of the JWT specs.
    # Instead use oauth2 as the type so that we can define scopes in swagger and we can use the 
    # swagger tools middleware to handle authorization. This approach may not be semantically correct but
    # is a practical get-around approach.
    type: oauth2
    authorizationUrl: www.sample.com
    flow: implicit
    scopes:
      admin: Administrative permission such as adding venues, managing users, etc.
      execute:wsts: Execute procedures on WSTS Venues
      execute:testbed: Execute procedures on Testbed Venues
      execute:sit: Execute procedures on System I&T Venues
      execute:other: Execute procedures on other Venues
      config_mgmt: Make changes to project configurations such as command dictionary
      imcm: Information management configuration management to release procedure
      test_lead: Test lead
      author: authoring procedure
      basic: basic level permission that includes adding comments

# Any scope can be used by default
security:
  - UserSecurity: ["admin", "execute:wsts", "execute:testbed", "execute:sit", "execute:other", "config_mgmt", "imcm", "test_lead", "author", "basic"]   

paths:

  /executions:
    post:
      tags:
        - Execution
      description: "Create an execution"
      operationId: "create_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]        
      parameters:
        - name: execution
          in: body
          description: "Execution meta data"
          required: true
          schema:
            $ref: "#/definitions/ExecutionInfoInput"
      responses:
        200:
          description: "Created"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    get:
      tags:
        - Execution
      description: Get a list of executions. List is sorted by start date by default (latest first).
      operationId: get_executions
      parameters:
        - $ref: "#/parameters/offset"
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"
        - name: sort_by
          in: query
          description: sort by this parameter
          required: false
          type: string
          enum:
            - EXECUTION_ID
            - TIME_STARTED
            - TIME_COMPLETED
            - VENUE_NAME               
            - STATUS        
        - name: execution_id
          in: query
          description: filter by execution_id
          required: false
          type: string        
        - $ref: "#/parameters/description"                
        - name: status
          in: query
          description: filter by status
          required: false
          type: string
          enum:
            - RUNNING
            - IDLE
            - PAUSED
            - HALTED
            - SUSPENDED
            - CLOSED
            - IN_REVIEW          
            - FINALIZED        
        - name: statuses
          in: query
          description: comma separated list of statuses
          required: false
          type: string     
        - $ref: "#/parameters/completed"     
        - name: from_time
          in: query
          description: search from this time (execution start time in UTC such as 2021-01-07T02:56:23.877Z)
          required: false
          type: string
        - name: to_time
          in: query
          description: search up to this time (execution start time in UTC such as 2021-01-07T02:56:23.877Z)
          required: false
          type: string
        - name: venue_id
          in: query
          description: filter by venue id
          required: false
          type: string
        - name: venue_name
          in: query
          description: filter by venue name
          required: false
          type: string     
        - name: venue_type
          in: query
          description: filter by venue type
          required: false
          type: string     
          enum:
            - WSTS
            - Testbed
            - ATLO
            - Other            
        - name: run_for_score
          in: query
          description: filter by run for score flag
          required: false
          type: boolean                   
        - name: test_conductor
          in: query
          description: filter by test_conductor
          required: false
          type: string                     
        - name: procedure_id
          in: query
          description: filter by procedure_id used in the execution
          required: false
          type: string
        - name: version
          in: query
          description: filter by procedure version used in the execution. procedure_id must be specified.
          required: false
          type: integer            
        - name: institutional_id    
          in: query
          description: filter by institutional id of procedure used in the execution
          required: false
          type: string                             
        - name: institutional_release_id  
          in: query
          description: filter by institutional release id of procedure version used in the execution. institutional_id must be specified.
          required: false
          type: string           

      responses:
        200:
          description: "Success"
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: "array"
            title: "ExecutionArray"
            items:
              $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/import:
    post:
      tags:
        - Execution
      description: Import execution
      operationId: import_execution
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other", "config_mgmt"]  
      consumes:
        - multipart/form-data        
      parameters:
        - name: execution_file
          in: formData
          description: gzip file of execution
          required: true
          type: file
      responses:
        200:
          description: Any warning or error messages
          schema:
            $ref: "#/definitions/ExecutionImportResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}:
    get:
      tags:
        - Execution
      description: "Get meta data of an execution"
      operationId: "get_execution"
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    patch:
      tags:
        - Execution
      description: "Update meta data of an execution"
      operationId: "update_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: execution_meta_data
          in: body
          description: meta data of execution
          required: true
          schema:
            $ref: "#/definitions/ExecutionInfo"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"   

    delete:
      tags:
        - Execution
      description: "Delete an execution"
      operationId: "delete_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        204:
          description: "Deleted"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}/export:
    get:
      tags:
        - Execution
      description: Export execution as a gzip file
      operationId: export_execution
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: tar.gzip file that contain a JSON data of the execution and attached files
          schema:
            type: file
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    
    x-swagger-router-controller: Execution      

  /executions/{execution_id}/status:
    get:
      tags:
        - Execution
      description: "Get the current status of the execution"
      operationId: "get_execution_status"
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionStatus"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    post:
      tags:
        - Execution
      description: "Update the current status of the execution"
      operationId: "update_execution_status"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: execution_status
          in: body
          description: status of the execution
          required: true
          schema:
            $ref: "#/definitions/ExecutionStatusInput"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}/boundary_elem:
    post:
      tags:
        - Execution
      description: Set boundary_elem_id to determine the scope of AUTO execution
      operationId: set_boundary_element
      parameters:
        - $ref: "#/parameters/execution_id"  
        - name: elem_id
          in: query
          description: id of the element for which execution starts
          required: true
          type: string                           
      responses:
        200:
          description: Execution 
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}/refresh:
    post:
      tags:
        - Execution
      description: Refresh computed elements in the execution. This only updates step references in VI Status steps.
      operationId: "refresh_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: Updated elements
          schema:
            type: "array"
            items:
              $ref: "#/definitions/ProcedureElement"            
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution             

  /executions/{execution_id}/resume:
    post:
      tags:
        - Execution
      description: "Resume an execution"
      operationId: "resume_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]        
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: resume_input
          in: body
          required: true
          schema:
            $ref: "#/definitions/ResumeInput"
      responses:
        200:
          description: Success
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}/suspend_resume:
    post:
      tags:
        - Execution
      description: "Suspend this execution and resume another execution on the same venue."
      operationId: "suspend_resume_execution"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]        
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: suspend_resume_input
          in: body
          required: true
          schema:
            $ref: "#/definitions/SuspendResumeInput"
      responses:
        200:
          description: Success. Resumed execution.
          schema:
            $ref: "#/definitions/ExecutionInfo"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"            
            
    x-swagger-router-controller: Execution              

  /executions/{execution_id}/break_points:
    delete:
      tags:
        - Execution
      description: Remove all break points of the execution
      operationId: "remove_break_points"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: Updated break points status
          schema:
            type: array
            items:
              $ref: '#/definitions/ElemIdAndBreakPoint'
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"            

    x-swagger-router-controller: Execution    
    
  /executions/{execution_id}/search:
    post:
      tags:
        - Search
      description: Search text in execution. POST is used instead of GET since web browser does not support passing body in GET.
      operationId: search_execution
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: search_input
          in: body
          description: Definition of search criteria
          required: true
          schema:
            $ref: "#/definitions/ExecutionSearchInput"
      responses:
        200:
          description: Search result
          schema:
            $ref: '#/definitions/SearchResult'
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    
            
    x-swagger-router-controller: Execution           

  /executions/{execution_id}/message:
    post:
      tags:
        - Search
      description: Post message to an execution. Use to generate info/warning/error message via Web Socket
      operationId: post_execution_message
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: execution_message
          in: body
          description: Definition of message
          required: true
          schema:
            $ref: "#/definitions/ExecutionMessage"
      responses:
        204:
          description: Message posted
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    
            
    x-swagger-router-controller: Execution        

  /executions/{execution_id}/steps:
    post:
      tags:
        - Execution
      description: Create a step
      operationId: create_execution_step
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/insert_after_id"
        - $ref: "#/parameters/level"
        - name: step
          in: body
          description: step definition including its type
          required: true
          schema:
            $ref: "#/definitions/Step"
      responses:
        200:
          description: Created
          schema:
            $ref: "#/definitions/AddStepResponse"
        default:
          description: Error
          schema:
            $ref: "#/definitions/ErrorResponse"
    get:
      tags:
        - Execution
      description: Get steps of the execution. List is sorted by the order in the execution.
      operationId: get_execution_steps
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/offset"
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"
        - $ref: "#/parameters/description"
      responses:
        200:
          description: "Success"
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: array
            items:
              $ref: '#/definitions/Step'
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}/elements:
    get:
      tags:
      - Execution
      description: Get elements of the specified type from execution. List is sorted by the order in the execution.
      operationId: get_execution_elements
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_type"
        - $ref: "#/parameters/step_type"
        - $ref: "#/parameters/offset"
        - $ref: "#/parameters/limit"
        - $ref: "#/parameters/sort"
        - $ref: "#/parameters/description"
        - $ref: "#/parameters/all_elements"                
        - $ref: "#/parameters/comment_filter"
        - $ref: "#/parameters/ar_comment_filter"
        - $ref: "#/parameters/dr_comment_filter"        
      responses:
        200:
          description: |
            Array of elements matching given query.
            Step element may include run_records of previous runs of the step as defined in StepWithRunRecords data model.
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: "array"
            title: "elements"
            items:
              $ref: "#/definitions/ProcedureElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}/outline:
    get:
      tags:
        - Execution
      description: Get outline view of execution
      operationId: get_execution_outline
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: "Outline elements"
          schema:
            type: "array"
            title: "elements"
            items:
              $ref: "#/definitions/OutlineElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"
    
    x-swagger-router-controller: Execution

  /executions/{execution_id}/simple_elements:
    get:
      tags:
      - Execution
      description: Get elements of execution (only key fields)
      operationId: get_execution_simple_elements
      parameters:
        - $ref: "#/parameters/execution_id"
      responses:
        200:
          description: |
            Array of elements of an execution (only key fields of elements)       
          headers:
            x-total-count:
              description: The total number of resources
              type: integer
          schema:
            type: "array"
            title: "elements"
            items:
              $ref: "#/definitions/ProcedureSimpleElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    

    x-swagger-router-controller: Execution     

  /executions/{execution_id}/elements/move:
    post:
      tags:
      - Execution
      description: Move elements and their children to another location in execution
      operationId: move_execution_element
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: move_element_input
          in: body
          schema:
            $ref: "#/definitions/MoveElementInput"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/MoveElementsResponse"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"

    x-swagger-router-controller: Execution

  /executions/{execution_id}/elements/copy:
    post:
      tags:
      - Execution
      description: Copy elements and their children to another location in execution
      operationId: copy_execution_element
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: copy_element_input
          in: body
          schema:
            $ref: "#/definitions/CopyElementInput"
      responses:
        200:
          description: "Success"
          schema:
            $ref: "#/definitions/CopyElementResponse"            
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    
    
    x-swagger-router-controller: Execution

  /executions/{execution_id}/elements/justify:
    post:
      tags:
        - Execution
      description: update justification of redline/blueline elements
      operationId: "execution_bulk_justify"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: bulk_justification_input
          in: body
          description: input data for redline/blueline bulk justification
          required: true
          schema:
            $ref: '#/definitions/BulkJustificationInput'
      responses:
        200:
          description: Updated elements are returned
          schema:
            type: array
            items:
              $ref: "#/definitions/ProcedureElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"  

    x-swagger-router-controller: Execution

  /executions/{execution_id}/elements/approve:
    post:
      tags:
        - Execution
      description: approve redline/blueline elements
      operationId: "execution_bulk_approve"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]   
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: bulk_approval_input
          in: body
          description: input data for bulk approval
          required: true
          schema:
            $ref: "#/definitions/BulkApprovalInput"
      responses:
        200:
          description: Updated elements are returned
          schema:
            type: array
            items:
              $ref: "#/definitions/ProcedureElement"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"  
          
    x-swagger-router-controller: Execution

  /executions/{execution_id}/elements/discard:
    post:
      tags:
        - Execution
      description: discard redline/blueline elements
      operationId: "execution_discard_elements"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - name: discard_input
          in: body
          required: true
          schema:
            $ref: "#/definitions/DiscardInput"
      responses:
        200:
          description: Element modifications discarded
          schema:
            $ref: "#/definitions/DiscardElementResponse"      
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    

    x-swagger-router-controller: Execution        

  /executions/{execution_id}/elements/{elem_id}:
    patch:
      tags:
        - Execution
      description: "Update an element"
      operationId: "execution_update_element"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
        - name: elem_input
          in: body
          description: element data to update
          required: true
          schema:
            $ref: "#/definitions/ProcedureElement"            
      responses:
        200:
          description: "Updated element"
          schema:
            $ref: "#/definitions/ProcedureElement" 
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"   
    delete:
      tags:
        - Execution
      description: "Delete an element"
      operationId: "execution_delete_element"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
      responses:
        200:
          description: "Deleted"
          schema:
            $ref: "#/definitions/ElementsNumberResponse"
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"  
             
    x-swagger-router-controller: Execution    

  /executions/{execution_id}/elements/{elem_id}/compute:
    post:
      tags:
        - Execution
      description: compute a step whose status is derived from other steps (such as VI Status step)
      operationId: "execution_compute_element"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
      responses:
        200:
          description: Updated element
          schema:
            $ref: "#/definitions/ProcedureElement"      
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    

    x-swagger-router-controller: Execution       

  /executions/{execution_id}/elements/{elem_id}/modify:
    post:
      tags:
        - Execution
      description: modify an element to create a redline/blueline 
      operationId: "execution_modify_element"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"
      responses:
        200:
          description: Modified element created. New redline element and changed numbers are returned.
          schema:
            $ref: "#/definitions/ModifyElementResponse"      
        default:
          description: "Error"
          schema:
            $ref: "#/definitions/ErrorResponse"    

    x-swagger-router-controller: Execution             

            
  /executions/{execution_id}/elements/{elem_id}/justify:
    post:
      tags:
        - Execution
      description: update justification of a redline/blueline
      operationId: "execution_justify_element"
      security:
        - UserSecurity: ["execute:wsts", "execute:testbed", "execute:sit", "execute:other"]      
      parameters:
        - $ref: "#/parameters/execution_id"
        - $ref: "#/parameters/elem_id"  
        - name: justification_input
          in: body
          description: input data for redline/blueline justification
          required: true
