    properties: 
      # note that properties of ProcedureVersionInput are repeated here.
      # "additionalProperties: false" does not work when "allOf:" is used.   
      version_description:
        description: Description of the version
        type: string
      version_author:
        description: The user who created this version 
        type: string        
      api_version:
        description: Indicates the version of the Ingenium API used to create the procedure version
        type: string
      flight_dictionary_version:
        description: The version of the flight dictionary selected for this version
        type: string    
      sse_dictionary_version:
        description: The version of the SSE dictionary selected for this version
        type: string
      institutional_release_id:
        description: The corresponding release id in the institutional CM or JPL doc
        type: string
      files:
        type: array
        items:
          $ref: '#/definitions/FileInfo'   
    additionalProperties: false
          
  ProcedureVersionInfo:
    description: meta data of the procedure version
    allOf:
    - $ref: '#/definitions/ProcedureVersionUpdateInput'
    - type: object
      properties:
        procedure_id:
          description: unique id of the procedure
          type: string
        version_id:
          description: unique id of the version. This is an internal id.
          type: string          
        version:
          description: Version of the procedure. 0 for working copy.
          type: integer
        time_versioned:
          description: The time the version was created
          type: string
        time_submitted:
          description: The time the version was submitted for review to institutional CM
          type: string
        time_approved:
          description: The time the version was approved in institutional CM
          type: string
        time_released:
          description: The time the version was released in institutional CM
          type: string
        time_obsoleted:
          description: The time the version was obsoleted
          type: string          
        time_saved:
          description: The last time the version was updated
          type: string          
        tags:
          description: tags available for elements in this procedure version
          type: array
          items:
            $ref: '#/definitions/Tag'    
        conversations_count:
          description: Number of conversations
          type: integer
        unresolved_conversations_count:
          description: Number of unresolved conversations
          type: integer        
        status:
          description: status of the procedure version
          type: string             
          enum:
            - WORKING
            - VERSIONED
            - SUBMITTED
            - APPROVED
            - RELEASED
            - OBSOLETE
  
  ProcedureVersionStatusInput:
    description: input to change status of a procedure version
    type: object
    properties:  
      action:
        description: Description of the version
        type: string
        enum:
        - SUBMIT
        - APPROVE
        - RELEASE
        - OBSOLETE
        - UNSUBMIT
        - UNAPPROVE
        - UNRELEASE
        - UNOBSOLETE
          
  ProcedureStructure:
    allOf:
    - $ref: '#/definitions/ProcedureVersionInfo'
    - type: object
      properties:
        children:
          type: array
          items:
            $ref: '#/definitions/ProcedureElementNested'           
          description: child elements        

  TagInput:
    description: input to change a tag
    properties:
      name:
        description: Name of the tag
        type: string        
      description:
        description: Description of the tag     
        type: string     
                  
  Tag:
    description: tag that can be applied to a procedure element
    allOf:
    - $ref: '#/definitions/TagInput'
    - type: object
      properties:
        tag_id:
          description: Unique id of the tag
          type: string           
          
  DeleteTagResponse:
    description: Response when a tag is deleted from a procedure. This includes tags of the procedure and elements that were impacted
    properties:
      tags:
        description: tags of the procedure
        type: array
        items:
          $ref: '#/definitions/Tag' 
      elems:            
        description: tags of elements that were impacted
        type: array
        items:
          $ref: '#/definitions/ElementTags'
                    
  ElementTags:
    description: tags of element
    properties:
      elem_id:
        description: Unique id of element
        type: string      
      tag_ids:
        description: ids of tags of the element  
        type: array
        items:
          type: string
     
  TagSelection:
    description: selection status of tag
    properties:
      tag_id:
        description: Unique id of the tag
        type: string        
      name:
        description: Name of the tag
        type: string   
      description:
        description: Description of the tag
        type: string                    
      selected:
        description: Selection status     
        type: boolean              
        
  LoggingInfo:
    type: object
    required:
      - level
    properties:
      level:
        type: string
        description: Current log level
        enum:
        - CRITICAL
        - ERROR
        - WARNING
        - INFO
        - DEBUG

  HealthStatus:
    type: object
    properties:
      status:
        type: string
        description: Current status of service
        enum:
        - OK
        - ERROR
        - UNKNOWN
      message:
        type: string
        description: Any error message

  ProcedureSearchInput:
    type: object
    properties:
      search_for:
        type: string
        description: text to search for (may contain wild card)
      match_case:
        type: boolean
        description: true for case sensitive search
        default: false
      match_whole_word:
        type: boolean
        description: true for whole word match
        default: false
      step_type_filters:
        type: array
        items:
          type: string
          enum:
            - MANUAL_INPUT
            - MANUAL_EIP
            - VENUE_CONFIG_MANUAL
            - ENVIRONMENT_MANUAL
            - GDS_MANUAL
            - VERIFICATION_ITEM
            - VERIFICATION_ITEM_STATUS
            - GRAPH_EHA
            - QUERY_EVR
            - VERIFY_EHA     
            - WAIT_EHA
            - BUS_1553
            - WAIT_EVR
            - LIST_DATA_PRODUCTS
            - WAIT_DATA_PRODUCTS
            - CMD
            - CMD_FILE
            - CMD_SCMF     
            - CMD_SSE  
            - VENUE_CONFIG_GET
            - VENUE_CONFIG_UPDATE
            - VENUE_CONFIG_CHECK      
            - MANUAL_VERIFICATION
            - CUSTOM_SCRIPT
            - ANALYSIS
            - WAIT  
            - TIME_REFERENCE
            - TOC
      field_filters:
        type: array
        items:
          type: string            
          enum:
            - TITLE
            - DESCRIPTION
            - ELEM_TYPE
            - STEP_TYPE
            - STATUS
            - COMMENT
            - DATA_PATH
            - COMMAND_STRING
            - EVR_NAME
            - CHANNEL_NAME
            - CHANNEL_ID
            - START_TIME
            - END_TIME
            - DURATION
            - TIMEOUT                    
            - LOOKBACK            
      start_elem_id:
        type: string
        description: id of element from which to search (inclusive)
      end_elem_id:
        type: string
        description: id of element to which to search (inclusive)

  ExecutionSearchInput:
    allOf:
    - $ref: '#/definitions/ProcedureSearchInput'
    - type: object    
      properties:
        status_filters:
          description: filter on status of step
          type: array
          items:
            type: string
            enum: 
              - PASS
              - FAIL
              - ERROR
              - OVERRIDE_PASS
              - OVERRIDE_FAIL
              - RUNNING
              - NONE          
        from_time:
          type: string
          description: Earliest step execution time in UTC
        to_time:
          type: string
          description: Latest step execution time in UTC 
                 
  SearchResult:
    type: object
    properties:
      search_for:
        type: string
        description: text to search for (may contain wild card)
      match_case:
        type: boolean
        description: true for case sensitive search
        default: false
      match_whole_word:
        type: boolean
        description: true for whole word match
        default: false
      matches:
        type: array
        items:
          $ref: '#/definitions/Match'
      total_count:
        type: integer
        description: total number of matches. Only up to 1000 them are returned in matches.

  Match:
    type: object
    properties:
      elem_id:
        description: Unique id of element
        type: string
      number:
        description: Number of element
        type: string    
      title:
        description: Title of element
        type: string
      elem_type:
        description: type of element
        type: string
      step_type:
        description: type of step
        type: string        
      field_path:
        type: string
        description: field path (dot separated)
      field_text:
        type: string
        description: text of the field with matches
      is_html:
        type: boolean
        description: true if this field may contain html content
      replaceable:
        type: boolean
        description: true if this field can be replaced       
      match_texts:
        type: array
        items:
          $ref: '#/definitions/MatchText'   
      total_count:
        type: integer
        description: total number of match_texts. Only up to 100 them are returned in match_texts.
        
  MatchText:
    type: object
    properties:    
      text:
        description: Found string
        type: string
      start_index:
        type: integer
        description: starting index of the text
      length:
        type: integer
        description: length of the text      
  
  ReplaceInput:
    type: object
    properties:
      search_for:
        type: string
        description: text to search for (may contain wild card)
      replace_with:
        type: string
        description: text to replace with        
      match_case:
        type: boolean
        description: true for case sensitive search
        default: false
      match_whole_word:
        type: boolean
        description: true for whole word match
        default: false
      replacements:
        type: array
        items:
          $ref: '#/definitions/Replacement'        
            
  Replacement:
    type: object
    properties:
      elem_id:
        description: Unique id of element
        type: string
      number:
        description: number of element
        type: string     
      field_path:
        type: string
        description: field path (dot separated)
      is_html:
        type: boolean
        description: true if this field may contain html content
        
  ReplacementOutput:
    type: object
    properties:
      elem_id:
        description: Unique id of element
        type: string
      number:
        description: number of element
        type: string        
      field_path:
        type: string
        description: field path (dot separated)
      field_value:
        type: string
        description: field value after replacement (this can be string, number or boolean)

  SwitchWait:
    type: object
    properties:
      switch_wait_secs:
        description: how long to wait before running steps after execution is switched
        type: integer
        default: 10

  SwitchWaitFlag:
    type: object
    properties:
      switch_wait_flag:
        description: Value of current switch wait flag. Empty string is no flag is set.
        type: string

  ExecutionMessage:
    type: object
    properties:
      level:
        type: string
        description: message level
        enum:
        - ERROR
        - INFO
      msg:
        description: message
        type: string        

parameters:

  execution_id:
    name: execution_id
    in: path
    description: unique id of execution
    required: true
    type: string

  elem_id:
    name: elem_id
    in: path
    description: unique id of a procedure element
    required: true
    type: string

  elem_type:
    name: elem_type
    in: query
    description: type of procedure element. If omitted, get all types.
    required: false
    type: string
    enum:
      - SECTION
      - PROCEDURE_SECTION
      - PARAGRAPH
      - STEP

  step_type:
    name: step_type
    in: query
    description: type of step. If omitted, get all types.
    required: false
    type: string
    enum:
      - MANUAL_INPUT
      - MANUAL_EIP
      - VENUE_CONFIG_MANUAL
      - ENVIRONMENT_MANUAL
      - GDS_MANUAL
      - VERIFICATION_ITEM
      - VERIFICATION_ITEM_STATUS
      - GRAPH_EHA
      - QUERY_EVR
      - VERIFY_EHA     
      - WAIT_EHA
      - BUS_1553
      - WAIT_EVR
      - LIST_DATA_PRODUCTS
      - WAIT_DATA_PRODUCTS
      - CMD
      - CMD_FILE
      - CMD_SCMF     
      - CMD_SSE  
      - VENUE_CONFIG_GET
      - VENUE_CONFIG_UPDATE
      - VENUE_CONFIG_CHECK      
      - MANUAL_VERIFICATION
      - CUSTOM_SCRIPT
      - ANALYSIS
      - WAIT  
      - TIME_REFERENCE
      - TOC      
  
  insert_after_id:
    name: insert_after_id
    in: query
    description: unique id of the element after which element will be added/inserted. To insert at the front, use "-1".
    required: true
    type: string   

  level:
    name: level
    in: query
    description: |
      Add as a sibling or a child. If insert_after_id is "-1", level must be empty or "CHILD".
      * `SIBLING` - As a sibling of insert_after_id element
      * `CHILD` - As a child of insert_after_element
    type: string
    enum:
      - SIBLING
      - CHILD

  offset:
    name: offset
    in: query
    description: Start index for pagination. zero based.
    required: false
    type: integer
    default: 0

  limit:
    name: limit
    in: query
    description: Max number of elements to return.
    required: false
    type: integer
    default: 50

  sort:
    name: sort
    in: query
    description: |
          Sort in natural order
          * `ASC` - Ascending
          * `DESC` - Descending
    required: false
    type: string
    enum:
      - ASC
      - DESC

  all_elements:
    name: all_elements
    in: query
    description: include all elements regardless of comments
    required: false
    type: string
    default: OFF
    enum:
      - ON
      - OFF
            
  comment_filter:
    name: comment_filter
    in: query
    description: include elements with general comments
    required: false
    type: string
    default: OFF
    enum:
      - ON
      - OFF
      
  ar_comment_filter:
    name: ar_comment_filter
    in: query
    description: include elements with activity report comments
    required: false
    type: string
    default: OFF
    enum:
      - ON
      - OFF
      
  dr_comment_filter:
    name: dr_comment_filter
    in: query
    description: include elements with data review report comments
    required: false
    type: string
    default: OFF
    enum:
      - ON
      - OFF

  procedure_label_name:
    name: procedure_label_name
    in: query
    description: Name of a procedure label
    required: false
    type: string

  title:
    name: title
    in: query
    description: Title of a procedure
    required: false
    type: string
    
  author:
    name: author
    in: query
    description: Author of a procedure
    required: false
    type: string    
                    
  description:
    name: description
    in: query
    description: Query for words in description
    required: false
    type: string
    
  institutional_id:
    name: institutional_id
    in: query
    description: Filter on institutional_id of procedure
    required: false
    type: string    

  version_description:
    name: version_description
    in: query
    description: Query for words in procedure version description
    required: false
    type: string    

  institutional_release_id:
    name: institutional_release_id
    in: query
    description: Filter on institutional_release_id of version
    required: false
    type: string 
    
  version_author:
    name: version_author
    in: query
    description: Query for words in version author
    required: false
    type: string 
        
  completed:
    name: completed
    in: query
    description: Get only completed or not completed executions
    required: false
    type: boolean

  venue_group_id:
    name: venue_group_id
    in: path
    description: "resource id of venue group"
    required: true
    type: string

  venue_id:
    name: venue_id
    in: path
    description: "resource id of venue"
    required: true
    type: string

  file_id:
    name: file_id
    in: path
    description: "resource id of an attached file"
    required: true
    type: string

  conversation_id:
    name: conversation_id
    in: path
    description: "resource id of a conversation"
    required: true
    type: string
    
  comment_id:
    name: comment_id
    in: path
    description: "resource id of a comment"
    required: true
    type: string


  procedure_id:
    name: procedure_id
    in: path
    description: unique id of procedure
    required: true
    type: string
  
  label_id:
    name: label_id
    in: path
    description: unique id of procedure label
    required: true
    type: string

  version:
    name: version
    in: path
    description: version of procedure
    required: true
    type: integer
    
  tag_id:
    name: tag_id
    in: path
    description: unique id of tag
    required: true
    type: string        

