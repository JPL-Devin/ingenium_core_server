        description: Whether to verify on the value or the change of the value
        type: string
        enum:
            - VALUE
            - CHANGE    
        default: VALUE    
      verification_condition:
        description: The type of verification to performed
        type: string
        enum:
          - GREATER_THAN
          - LESS_THAN
          - GREATER_THAN_OR_EQUAL
          - LESS_THAN_OR_EQUAL
          - EQUAL
          - NOT_EQUAL
          - RECORD
          - NOT_PRESENT
          - CONTAINS
          - INCLUSIVE_RANGE
          - EXCLUSIVE_RANGE
        default: RECORD  
      verification_values:
        description: values to verify the result against
